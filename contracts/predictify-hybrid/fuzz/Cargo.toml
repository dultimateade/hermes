[package]
name = "predictify-hybrid-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
predictify-hybrid = { path = ".." }
soroban-sdk = { workspace = true, features = ["testutils"] }

[[bin]]
name = "market_lifecycle"
path = "targets/market_lifecycle.rs"

[[bin]]
name = "betting_payout"
path = "targets/betting_payout.rs"

[[bin]]
name = "dispute_escalation"
path = "targets/dispute_escalation.rs"